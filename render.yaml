services:
  # -------------------------------------------------------------------
  # 1. NestJS Backend API Web Service
  # -------------------------------------------------------------------
  - type: web
    name: talentswap-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @talentswap/api... build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @talentswap/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: talentswap-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: talentswap-redis
          property: connectionString
      - key: JWT_ISSUER
        value: talentswap-api
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      # Set your RSA PEM strings in Render dashboard (or sync: false)
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Cross-service URLs
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: talentswap-web
          property: url
      - key: APP_PUBLIC_URL
        fromService:
          type: web
          name: talentswap-web
          property: url

  # -------------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # -------------------------------------------------------------------
  - type: web
    name: talentswap-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @talentswap/web... build
    startCommand: pnpm --filter @talentswap/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_DEMO_FALLBACK
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: talentswap-api
          property: url
        valueTemplate: ${talentswap-api.url}/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: talentswap-api
          property: url

  # -------------------------------------------------------------------
  # 3. Background Worker (BullMQ tasks) - Note: Worker requires Starter plan
  # -------------------------------------------------------------------
  - type: worker
    name: talentswap-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @talentswap/worker... build
    startCommand: pnpm --filter @talentswap/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talentswap-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: talentswap-redis
          property: connectionString

# ---------------------------------------------------------------------
# Managed PostgreSQL Database (Includes pgvector support)
# ---------------------------------------------------------------------
databases:
  - name: talentswap-db
    databaseName: talentswap
    user: postgres
    plan: free
    region: oregon

# ---------------------------------------------------------------------
# Managed Redis (Cache, BullMQ, Socket.io Adapter)
# Note: Render Redis starts on the Starter plan ($7/mo).
# Alternatively, you can use a free Upstash Redis instance and set REDIS_URL.
# ---------------------------------------------------------------------
# - type: redis
#   name: talentswap-redis
#   plan: starter
#   region: oregon
