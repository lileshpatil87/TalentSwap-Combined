services:
  # -------------------------------------------------------------------
  # 1. NestJS Backend API Web Service (100% FREE TIER)
  # -------------------------------------------------------------------
  - type: web
    name: talentswap-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @talentswap/api... build
    startCommand: pnpm db:migrate && pnpm --filter @talentswap/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: talentswap-db
          property: connectionString
      # Free Redis from Upstash (https://upstash.com) - rediss://default:...@...upstash.io:6379
      - key: REDIS_URL
        sync: false
      - key: JWT_ISSUER
        value: talentswap-api
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      # RSA keys generated via scripts/generate-jwt-keys.ps1
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Public URL of your frontend (e.g. https://talentswap-web.onrender.com)
      - key: CORS_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

  # -------------------------------------------------------------------
  # 2. Next.js Frontend Web Service (100% FREE TIER)
  # -------------------------------------------------------------------
  - type: web
    name: talentswap-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @talentswap/web... build
    startCommand: pnpm --filter @talentswap/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_DEMO_FALLBACK
        value: "false"
      # Public URL of your API (e.g. https://talentswap-api.onrender.com/api/v1)
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      # Public URL of your Socket.io server (e.g. https://talentswap-api.onrender.com)
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false

# ---------------------------------------------------------------------
# Managed PostgreSQL Database (100% FREE TIER)
# ---------------------------------------------------------------------
databases:
  - name: talentswap-db
    databaseName: talentswap
    user: talentswap
    plan: free
    region: oregon
